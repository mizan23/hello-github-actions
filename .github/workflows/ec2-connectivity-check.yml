name: EC2 Connectivity Check

on:
  push:
    branches:
      - main

jobs:
  check-ec2-connectivity:
    name: Verify EC2 Connection & Extract AWS Metadata
    runs-on: [self-hosted, aws, dev]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key & Known Hosts
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key ONLY if it does not already exist
          if [ ! -f ~/.ssh/ec2_key ]; then
            echo "Writing EC2 SSH private key..."
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key
          else
            echo "EC2 SSH key already exists, skipping."
          fi

          # Add EC2 host to known_hosts ONLY if not already present
          if ! ssh-keygen -F "${{ secrets.EC2_HOST }}" > /dev/null; then
            echo "Adding EC2 host to known_hosts..."
            ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          else
            echo "EC2 host already present in known_hosts, skipping."
          fi

      - name: Test EC2 Connectivity
        run: |
          echo "Testing SSH connection to EC2 instance..."
          ssh -i ~/.ssh/ec2_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "echo 'SSH connection successful!'"

      - name: Extract EC2 Metadata
        run: |
          echo "Extracting EC2 instance metadata..."
          ssh -i ~/.ssh/ec2_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail

            echo "=================================================="
            echo "          EC2 Instance Information"
            echo "=================================================="

            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Public IP Address:"
            PUBLIC_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/public-ipv4)

            if [ -n "$PUBLIC_IP" ]; then
              echo "$PUBLIC_IP"
            else
              echo "No public IPv4 assigned (private subnet or NAT)"
            fi

            echo ""
            echo "Private IP Address:"
            curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/local-ipv4 \
              || echo "Unable to retrieve private IP"

            echo ""
            echo "Instance ID:"
            curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id \
              || echo "Unable to retrieve instance ID"

            echo ""
            echo "Availability Zone:"
            curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone \
              || echo "Unable to retrieve AZ"

            echo ""
            echo "Instance Type:"
            curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-type \
              || echo "Unable to retrieve instance type"

            echo ""
            echo "System Uptime:"
            uptime

            echo ""
            echo "=================================================="
            echo "          Connection Check Complete!"
            echo "=================================================="
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key
